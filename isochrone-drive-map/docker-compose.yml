name: isochrone-drive-map

services:
  # 路由引擎：Valhalla 官方 scripted 镜像
  # 首次启动前必须先用 scripts/build_tiles.sh 构建 tiles
  valhalla:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla-scripted:latest}
    container_name: isochrone-valhalla
    restart: unless-stopped
    volumes:
      - ./data/valhalla:/custom_files
    environment:
      use_tiles_ignore_pbf: "True"
      serve_tiles: "True"
      server_threads: "${VALHALLA_THREADS:-2}"
      build_tar: "True"
      build_admins: "True"
      build_time_zones: "${VALHALLA_BUILD_TIMEZONES:-False}"
    mem_limit: 4g
    networks:
      - isochrone-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI：等时圈 + 本地水系/城市点合并
  api-backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    container_name: isochrone-api
    restart: unless-stopped
    volumes:
      - ./data:/data:ro
    environment:
      VALHALLA_URL: http://valhalla:8002
      DATA_DIR: /data
    mem_limit: 1g
    depends_on:
      - valhalla
    networks:
      - isochrone-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Nginx：静态 MapLibre 页面 + 反向代理 /api
  frontend-web:
    build: ./frontend
    container_name: isochrone-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api-backend
    networks:
      - isochrone-net

networks:
  isochrone-net:
    driver: bridge
