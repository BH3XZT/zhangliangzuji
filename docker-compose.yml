# 地图轨迹合并工具 —— Docker Compose 编排
#
# 常用命令：
#   docker compose up -d --build   # 只启动轨迹合并主服务
#   docker compose --profile isochrone up -d --build  # 同时启动等时圈 Valhalla 服务
#   docker compose ps              # 查看容器状态与健康检查结果
#   docker compose logs -f         # 跟随查看日志
#   docker compose down            # 停止并移除容器（./data 中的数据保留）
#
# 修改宿主机端口：在项目根目录新建 .env 文件，写入 MAPTRACK_PORT=9000，然后重新启动。
# 容器内部端口固定为 8000，不需要改动。

name: maptrack-merger

services:
  maptrack:
    build: .
    image: maptrack-merger:1.6.0
    container_name: maptrack-merger
    ports:
      - "${MAPTRACK_PORT:-8000}:8000"
    volumes:
      # 宿主机 ./data 挂载到容器 /app/data；容器内以 uid 10001 运行
      # Linux 下若出现 Permission denied，请执行：sudo chown -R 10001:10001 ./data
      - ./data:/app/data
    environment:
      TZ: "Asia/Shanghai"
      PORT: "8000"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      LANG: "C.UTF-8"
      # 等时圈页面通过该地址请求 Valhalla；未启动 valhalla 时只影响等时圈页面
      VALHALLA_URL: "http://valhalla:8002"
    restart: unless-stopped
    healthcheck:
      # 与 Dockerfile 中的 HEALTHCHECK 保持一致：python 标准库 urllib 请求 /api/health
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 城市自驾等时圈路由引擎（可选 profile）
  # 先运行 scripts/isochrone/ 下的下载/构建/提取脚本，再启动：
  #   docker compose --profile isochrone up -d
  valhalla:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla-scripted:latest}
    container_name: maptrack-valhalla
    profiles: ["isochrone"]
    restart: unless-stopped
    volumes:
      - ./data/isochrone/valhalla:/custom_files
    environment:
      use_tiles_ignore_pbf: "True"
      serve_tiles: "True"
      server_threads: "${VALHALLA_THREADS:-2}"
      build_tar: "True"
      build_admins: "True"
      build_time_zones: "${VALHALLA_BUILD_TIMEZONES:-False}"
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
